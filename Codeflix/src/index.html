<!doctype html>
<!-- Documento HTML5 -->
<html lang="es"> <!-- idioma de la página: español -->
<head>
  <meta charset="utf-8" /> <!-- conjunto de caracteres UTF-8 -->
  <title>CODEFLIX</title> <!-- título mostrado en la pestaña del navegador -->
  <link rel="stylesheet" href="styles/style.css" /> <!-- hoja de estilos principal -->

  <script>
    // Función para abrir la puerta de la cripta (se ejecuta en main.js)
    window.openCryptDoor = function() {
      const door = document.getElementById('crypt-door'); // obtiene overlay de la puerta
      if (door) {
        // 1. Inicia la animación de apertura añadiendo la clase 'open'
        door.classList.add('open'); // añade clase CSS que dispara la animación
        // 2. Elimina el elemento del DOM después de que termine la animación
        setTimeout(() => {
          door.remove(); // elimina el overlay transcurrido el tiempo
        }, 2500); 
      }
    };
  </script>
</head>
<body>

  <div id="crypt-door" class="crypt-door-overlay"> <!-- overlay con animación de puerta -->
    <div class="door-half left-half"></div> <!-- mitad izquierda de la puerta -->
    <div class="door-half right-half"></div> <!-- mitad derecha de la puerta -->
    <div class="door-logo">CODEFLIX</div> <!-- logo sobre la puerta -->
  </div>
  
  <header> <!-- cabecera con título y búsqueda -->
    <div class="header-container"> <!-- contenedor de elementos del header -->
      <div class="header-title">🩸 La Cripta del Cine</div> <!-- título visible en la cabecera -->
      <div class="search-container"> <!-- contenedor del input de búsqueda -->
        <input id="search" placeholder="Buscar por título o filtrar gore mínimo (ej: gore:3)..." /> <!-- campo de búsqueda -->
      </div>
    </div>
  </header>

  <main>
    <div id="contenido-pagina-1" class="pagina-contenido"> <!-- sección principal con carruseles -->
      <h2>🎥 Películas Recomendadas</h2> <!-- título del primer carrusel -->
      <div class="carousel-wrapper"> <!-- wrapper que contiene flechas y contenedor -->
        <button class="arrow left" data-carousel="recommended">❮</button> <!-- flecha izquierda -->
        <div class="carousel-container" id="carousel-recommended"></div> <!-- contenedor donde se renderiza el carrusel -->
        <button class="arrow right" data-carousel="recommended">❯</button> <!-- flecha derecha -->
      </div>

      <h2>🇯🇵 Favoritas de Japón</h2>
      <div class="carousel-wrapper">
        <button class="arrow left" data-carousel="favoritesJapan">❮</button>
        <div class="carousel-container" id="carousel-favoritesJapan"></div>
        <button class="arrow right" data-carousel="favoritesJapan">❯</button>
      </div>

      <h2>🇰🇷 Terror Coreano</h2>
      <div class="carousel-wrapper">
        <button class="arrow left" data-carousel="koreanHorror">❮</button>
        <div class="carousel-container" id="carousel-koreanHorror"></div>
        <button class="arrow right" data-carousel="koreanHorror">❯</button>
      </div>

      <h2>🇫🇷 Cine Extremo Francés</h2>
      <div class="carousel-wrapper">
        <button class="arrow left" data-carousel="frenchExtreme">❮</button>
        <div class="carousel-container" id="carousel-frenchExtreme"></div>
        <button class="arrow right" data-carousel="frenchExtreme">❯</button>
      </div>
      
      <h2>🇪🇸 Favoritas de España</h2>
      <div class="carousel-wrapper">
        <button class="arrow left" data-carousel="favoritesSpain">❮</button>
        <div class="carousel-container" id="carousel-favoritesSpain"></div>
        <button class="arrow right" data-carousel="favoritesSpain">❯</button>
      </div>

      <h2>🇺🇸 Favoritas de USA</h2>
      <div class="carousel-wrapper">
        <button class="arrow left" data-carousel="favoritesUSA">❮</button>
        <div class="carousel-container" id="carousel-favoritesUSA"></div>
        <button class="arrow right" data-carousel="favoritesUSA">❯</button>
      </div>
    </div>

    <section id="all-movies"> <!-- sección con listado completo paginado -->
      <h2>Todas las películas</h2>
      <div id="movies-grid" class="movies-grid"></div> <!-- grid donde se muestran las tarjetas pequeñas -->
      <div id="movies-pagination" class="pagination"></div> <!-- contenedor de la paginación -->
    </section>
  </main>

  <script>
    // Control de visibilidad de carruseles
    window.actualizarVisibilidadCarruseles = function(paginaActual) { // muestra/oculta carruseles según la página
      const contenidoPagina1 = document.getElementById('contenido-pagina-1'); // contenedor principal de carruseles
      
      if (paginaActual === 1) {
        contenidoPagina1.style.display = 'block'; // mostrar carruseles
      } else {
        contenidoPagina1.style.display = 'none'; // ocultar carruseles
      }
    }

    // ARREGLO DE SCROLL: La función ahora decide a dónde hacer scroll basándose en la página.
    window.scrollToTop = function(paginaActual) { // desplaza la vista según la página actual
      let targetElement;
      
      if (paginaActual === 1) {
        // PÁGINA 1: Scroll al inicio de los carruseles (Recomendadas)
        targetElement = document.getElementById('contenido-pagina-1'); // objetivo: carruseles
      } else {
        // PÁGINAS > 1: Scroll al inicio del listado paginado
        targetElement = document.getElementById('all-movies'); // objetivo: lista paginada
      }

      if (targetElement) {
        targetElement.scrollIntoView({
          behavior: 'smooth', // desplazamiento suave
          block: 'start' // al inicio del elemento
        });
      }
    }

    // Inicializar - carruseles visibles en página 1
    document.addEventListener('DOMContentLoaded', function() {
      actualizarVisibilidadCarruseles(1); // al cargar, mostrar carruseles
    });
  </script>

  <script src="scripts/main.js"></script> <!-- script principal de la aplicación -->
</body>
</html>
